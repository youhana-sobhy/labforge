[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labforge"
version = "0.1.0"
description = "On-demand virtual network labs: launch a realistic topology in seconds, test changes safely, and let it clean itself up."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "docker>=7.0",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
labforge = "labforge.cli:app"

[tool.setuptools]
packages = ["labforge"]

[tool.setuptools.package-data]
labforge = ["web/*", "web/vendor/*", "catalog/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a Docker daemon and launches real labs"]
