<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabForge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6a3d'/%3E%3Cpath d='M8 20h16l-3 5H11zM10 12h12v5H10z' fill='white'/%3E%3Ccircle cx='22' cy='8' r='2' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/xterm.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M7.5 19.5h17l-3.2 5.5H10.7z" fill="#fff"/><path d="M10 11.5h12v5.5H10z" fill="#fff" opacity=".9"/><circle cx="22.5" cy="7.5" r="1.8" fill="#fff"/><circle cx="26" cy="10.5" r="1.1" fill="#fff" opacity=".7"/></svg>
        </span>
        <span class="brand-text">LabForge<small>Virtual network labs</small></span>
      </a>
      <nav class="nav">
        <a href="#/" data-route="overview"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg>Overview</a>
        <a href="#/catalog" data-route="catalog"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>Catalog</a>
        <a href="#/labs" data-route="labs"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7.5l2.8 8.3M16 7.5l-2.8 8.3M8.5 6h7"/></svg>My labs<span class="nav-count" id="nav-active"></span></a>
        <a href="#/activity" data-route="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</a>
      </nav>
      <div class="sidebar-foot">
        <div class="engine" id="engine-status"><span class="dot"></span><span>Connecting…</span></div>
        <button class="user-chip" id="user-chip" title="Change name"><span class="avatar" id="user-avatar">?</span><span id="user-name">Set your name</span></button>
        <button class="theme-toggle" id="theme-toggle" title="Toggle light / dark">
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/static/vendor/xterm.js"></script>
  <script src="/static/vendor/addon-fit.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
